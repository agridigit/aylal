replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable
port: 8080
sync_rules:
  path: sync-rules.yaml
client_auth:
  # HS256 key shared with the API (AYLAL_JWT_SECRET), base64url-encoded by the compose entrypoint.
  # No kid on purpose: the API issues tokens without kid, which matches a key defined without kid.
  jwks:
    keys:
      - kty: oct
        alg: HS256
        k: !env PS_JWT_KEY
  audience: [powersync]
