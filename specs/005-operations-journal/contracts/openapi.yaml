openapi: 3.1.0
info: {title: AYLAL F6 - Journal des operations et registre phyto, version: 0.1.0}
# Toutes les routes : Bearer, farm_context. Non-membre / ferme inconnue ou supprimee => 404 identique.
# Reponses communes : 401, 403 (role), 404 (hors ferme, parcelle non visible), 413 (lot/photo trop grand), 422, 429 (Retry-After).
paths:
  /v1/farms/{farm_id}/operations:
    get:
      summary: Journal (ordre chronologique, curseur). worker => ses lignes visibles seulement.
      parameters: [{name: limit, in: query, schema: {type: integer, maximum: 200, default: 50}}, {name: cursor, in: query, schema: {type: string}}, {name: parcel_id, in: query, schema: {type: string, format: uuid}}, {name: type, in: query, schema: {type: string}}, {name: status, in: query, schema: {type: string}}]
      responses: {"200": {description: page}}
    post:
      summary: Creer une operation (idempotent par id client). Avertissements recalcules serveur.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/OperationInput"}}}}
      responses: {"201": {description: creee}, "413": {description: trop de parcelles / quota}, "422": {description: validation}}
  /v1/farms/{farm_id}/operations/{operation_id}:
    get: {summary: Detail, responses: {"200": {description: ok}, "404": {description: inconnue ou non visible}}}
    patch: {summary: Corriger (owner/manager) => reversal + application + operation_corrections, responses: {"200": {description: ok}, "403": {description: worker}}}
  /v1/farms/{farm_id}/operations/{operation_id}/done: {post: {summary: Marquer faite (planifiee), responses: {"200": {description: ok}}}}
  /v1/farms/{farm_id}/operations/{operation_id}/cancel: {post: {summary: Annuler (ecriture compensatoire pour un traitement fait), responses: {"200": {description: ok}}}}
  /v1/farms/{farm_id}/operations/{operation_id}/validate: {post: {summary: Valider (owner/manager), responses: {"200": {description: ok}, "403": {description: worker}}}}
  /v1/farms/{farm_id}/operations/{operation_id}/corrections: {get: {summary: Historique des corrections (owner/manager), responses: {"200": {description: ok}}}}
  /v1/farms/{farm_id}/operations/check:
    post: {summary: Controles phyto sans enregistrer (avertissements), responses: {"200": {description: warnings}}}
  /v1/farms/{farm_id}/operations/parse:
    post: {summary: Analyse d'une phrase dictee (<= 500 car.), pre-remplissage sans enregistrement ; 429 par utilisateur, responses: {"200": {description: draft + champs ambigus}}}
  /v1/farms/{farm_id}/operations/label:
    post: {summary: Reconnaissance d'etiquette (photo <= 3 Mo) ; 503 code label_unavailable => repli par nom, responses: {"200": {description: produits candidats}}}
  /v1/farms/{farm_id}/fields/{field_id}/earliest-harvest:
    get: {summary: Date de recolte au plus tot ; worker : parcelle attribuee non archivee sinon 404, responses: {"200": {description: "{date|null, unknown_dar: bool, limiting_product}"}}}
  /v1/farms/{farm_id}/registry:
    get: {summary: Vue courante du registre (owner/manager ; worker 403), parameters: [{name: parcel_id, in: query, schema: {type: string, format: uuid}}, {name: from, in: query, schema: {type: string, format: date}}, {name: to, in: query, schema: {type: string, format: date}}, {name: limit, in: query, schema: {type: integer, maximum: 200}}], responses: {"200": {description: page}}}
  /v1/farms/{farm_id}/registry/exports:
    post: {summary: Demander un export PDF/XLSX (<= 10 000 lignes, 1 actif par ferme, 10/h), responses: {"202": {description: job}, "409": {description: export deja actif}, "422": {description: periode > 5 ans ou > 10000 lignes}}}
  /v1/farms/{farm_id}/registry/exports/{job_id}:
    get: {summary: Etat et URL signee 15 min, responses: {"200": {description: ok}}}
  /v1/phyto-products:
    get: {summary: Recherche par nom ou matiere active (utilisateur authentifie), parameters: [{name: q, in: query, schema: {type: string, maxLength: 80}}, {name: crop, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, maximum: 50}}], responses: {"200": {description: produits + catalog_version.source_date}}}
  /v1/sync/upload:
    post: {summary: "Etendu F6 : operations, operation_parcels via commandes ; meme authorize que REST ; lot <= 100 (413 batch_too_large avant ecriture)", responses: {"200": {description: resultats par op}}}
components:
  schemas:
    OperationInput:
      type: object
      required: [id, type, performed_on, parcel_ids]
      properties:
        id: {type: string, format: uuid}
        type: {enum: [phyto, fertilization, irrigation, tillage, sowing_planting, pruning, weeding, harvest, other]}
        performed_on: {type: string, format: date}
        parcel_ids: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}}
        product_id: {type: string, format: uuid, nullable: true}
        free_product_name: {type: string, maxLength: 80, nullable: true}
        dose: {type: number, exclusiveMinimum: 0, maximum: 100000, nullable: true}
        dose_unit: {type: string, nullable: true}
        quantity_total: {type: number, exclusiveMinimum: 0, maximum: 100000, nullable: true}
        operator_name: {type: string, maxLength: 80, nullable: true}
        note: {type: string, maxLength: 500, nullable: true}
        label_photo_key: {type: string, nullable: true}
    Warning:
      type: object
      properties:
        code: {enum: [not_authorized_for_crop, dose_above_max, max_applications_reached, dar_unknown, free_product_unchecked]}
        parcel_id: {type: string, format: uuid}
        data: {type: object}
