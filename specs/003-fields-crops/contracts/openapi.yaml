openapi: 3.1.0
info: { title: AYLAL API — F2 (extension de F0/F1), version: 0.3.0 }
x-conventions:
  scope: "Toute route /farms/{farm_id}/* : non-membre, ferme supprimée ou parcelle/bloc/campagne d'une autre ferme -> 404 (identique à inexistant) ; membre sans droit -> 403. Ouvrier : parcelle non attribuée -> 404 ; action de gestion sur parcelle attribuée -> 403. Parcelle archivée -> 404 sur les routes normales (seules /fields/archived et /restore la voient). Les mêmes règles s'appliquent à /v1/sync/upload (tables parcels, seasons, field_blocks, crops, field_commands)."
  server_fields: "area_calc_ha, status_summary, created_by, purge_after, farm_id (existant) sont imposés par le serveur ; toute valeur cliente est ignorée."
  errors: "detail = {code, field?} ; codes : geometry_invalid, geometry_self_intersecting (avec crossings[]), geometry_too_complex, area_out_of_bounds, outside_morocco, season_already_active, season_date_mismatch, block_outside_field, block_overlap, merge_not_contiguous, crop_not_found, too_many_fields."
  warnings: "Réponses 200/201 de fields : warnings[] non bloquants, ex. {code:'overlap', field_ids:[...]}, {code:'imagery_unsuitable'}."
paths:
  /v1/crops: { get: { summary: Référentiel partagé (16 cultures) + cultures libres de la ferme via ?farm_id (membre), responses: { "200": {description: ok}, "404": {description: ferme inconnue ou non membre} } } }
  /v1/farms/{farm_id}/crops: { post: { summary: Ajouter une culture libre (owner/manager), responses: { "201": {description: ok}, "403": {description: ouvrier}, "404": {description: non membre}, "422": {description: nom ou cycle invalide} } } }
  /v1/farms/{farm_id}/fields: { get: { summary: Parcelles actives (ouvrier - attribuées seulement), responses: { "200": {description: ok}, "404": {description: non membre} } }, post: { summary: Créer (geometry GeoJSON Polygon, name, irrigation, greenhouse, area_declared_ha, source), responses: { "201": {description: ok + warnings}, "403": {description: ouvrier}, "404": {description: non membre}, "422": {description: géométrie ou champ invalide} } } }
  /v1/farms/{farm_id}/fields/archived: { get: { summary: Parcelles archivées (owner/manager), responses: { "200": {description: ok}, "404": {description: non membre ou ouvrier} } } }
  /v1/farms/{farm_id}/fields/{field_id}: { get: { summary: Fiche, responses: { "200": {description: ok}, "404": {description: autre ferme, archivée, supprimée ou non attribuée} } }, patch: { summary: Modifier, responses: { "200": {description: ok + warnings}, "403": {description: ouvrier (parcelle attribuée)}, "404": {description: invisible}, "422": {description: invalide} } }, delete: { summary: Archiver 90 jours, responses: { "204": {description: ok}, "403": {description: refusé}, "404": {description: invisible} } } }
  /v1/farms/{farm_id}/fields/{field_id}/restore: { post: { summary: Restaurer une parcelle archivée (<= 90 j), responses: { "200": {description: ok}, "403": {description: refusé}, "404": {description: inconnue, autre ferme ou purgée} } } }
  /v1/farms/{farm_id}/fields/merge: { post: { summary: Fusionner (survivor_id, merged_ids[]) ; équivalent serveur de la commande hors ligne, responses: { "200": {description: ok}, "403": {description: refusé}, "404": {description: parcelle d'une autre ferme ou inconnue}, "422": {description: merge_not_contiguous ou moins de deux parcelles} } } }
  /v1/farms/{farm_id}/fields/{field_id}/blocks: { get: { summary: Blocs et secteurs, responses: { "200": {description: ok}, "404": {description: invisible} } }, post: { summary: Découper (créer un bloc), responses: { "201": {description: ok}, "403": {description: refusé}, "404": {description: invisible}, "422": {description: block_outside_field ou block_overlap} } } }
  /v1/farms/{farm_id}/fields/{field_id}/blocks/{block_id}: { patch: { summary: Modifier, responses: { "200": {description: ok}, "403": {description: refusé}, "404": {description: bloc d'une autre parcelle ou ferme} } }, delete: { summary: Supprimer le bloc, responses: { "204": {description: ok}, "403": {description: refusé}, "404": {description: inconnu} } } }
  /v1/farms/{farm_id}/fields/{field_id}/seasons: { get: { summary: Campagnes (actives et historique), responses: { "200": {description: ok}, "404": {description: invisible} } }, post: { summary: Démarrer une campagne (crop_id, variety?, planting_year xor sowing_date, started_at, close_ids? pour rotation), responses: { "201": {description: ok}, "403": {description: refusé}, "404": {description: invisible ou crop d'une autre ferme}, "409": {description: season_already_active}, "422": {description: dates incohérentes avec le cycle} } } }
  /v1/farms/{farm_id}/fields/{field_id}/seasons/{season_id}: { get: { summary: Détail, responses: { "200": {description: ok}, "404": {description: inconnue} } }, patch: { summary: Corriger le stade, la variété, la destination, clôturer (ended_at), responses: { "200": {description: ok}, "403": {description: refusé}, "404": {description: inconnue}, "422": {description: invalide} } } }
